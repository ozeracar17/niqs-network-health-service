apiVersion: apps/v1
kind: Deployment
metadata:
  name: niqs-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: niqs-api
  template:
    metadata:
      labels:
        app: niqs-api
    spec:
      containers:
      - name: niqs-api
        image: niqs-api:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: postgres-secret
        - configMapRef:
            name: postgres-config
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: niqs-api-service
spec:
  selector:
    app: niqs-api
  ports:
  - port: 8000
    targetPort: 8000

